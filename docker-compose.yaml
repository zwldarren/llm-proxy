services:
  llm-proxy:
    image: ghcr.io/zwldarren/llm-proxy:stable
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-llmproxy}:${POSTGRES_PASSWORD:-llmproxy}@db:5432/${POSTGRES_DB:-llmproxy}
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      # Required for more than one worker: rate-limit windows, the spend budget
      # and the config cache are shared through Redis instead of per-process.
      - REDIS_RATE_LIMIT_ENABLED=true
      - REDIS_CACHE_ENABLED=true
    # Worker count is auto-selected (CPU budget, capped at 16) because the
    # backing store is PostgreSQL; override with UVICORN_WORKERS in .env.
    env_file:
      # Optional: create a .env only to override defaults (see .env.example)
      - path: .env
        required: false

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-llmproxy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-llmproxy}
      - POSTGRES_DB=${POSTGRES_DB:-llmproxy}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmproxy} -d ${POSTGRES_DB:-llmproxy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
