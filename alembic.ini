# Alembic Configuration for LLM Proxy
#
# The database URL is obtained from environment variables (DATABASE_URL or LLM_PROXY_DB_PATH)
# and should NOT be hardcoded here.

[alembic]
script_location = src/llm_proxy/database/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

# SQLAlchemy URL - configured programmatically from environment variables in env.py
sqlalchemy.url = 

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = uv
ruff.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
