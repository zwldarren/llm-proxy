[project]
name = "llm-proxy"
version = "0.2.2"
description = "A self-hostable, multi-provider LLM API gateway with protocol translation, streaming, rate limiting, MCP integration, and a Vue 3 admin dashboard."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "pydantic>=2.12.3",
  "fastapi>=0.120.4",
  "uvicorn>=0.38.0",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "PyJWT>=2.10.1",
  "cryptography>=43.0.0",
  "python-dotenv>=1.0.0",
  "platformdirs>=4.0.0",
  "orjson>=3.11.5",
  "slowapi>=0.1.9",
  "alembic>=1.17.2",
  "tiktoken>=0.12.0",
  "redis>=7.1.0",
  "bcrypt>=5.0.0",
  "opentelemetry-api>=1.44.0",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp>=1.44.0",
  "mcp>=2.0.0",
  "httpx2>=2.2.0",
  "websockets>=15.0",
  "langfuse>=4.7.1,<5.0.0",
  "pydantic-settings>=2.14.1",
  "numpy>=2.5.1",
  "packaging>=26.3",
]

[project.optional-dependencies]
# Embedding-based smart-routing signal (Signal C). Heavy ML stack; the core
# proxy degrades gracefully to the built-in structural signals without it.
smart-routing = [
  "scikit-learn>=1.9.0",
  "xgboost>=3.4.0",
  "transformers>=5.12.1",
  "onnxruntime>=1.27",
  "huggingface-hub>=1.21",
]

[dependency-groups]
dev = [
  "locust>=2.43.4",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "responses>=0.26.0",
  "ruff>=0.14.3",
  "ty>=0.0.2",
  "vulture>=2.16",
]

[build-system]
requires = ["uv_build>=0.9.6,<1.0"]
build-backend = "uv_build"

[project.scripts]
llm-proxy = "llm_proxy.__main__:main_wrapper"
llm-proxy-dev = "llm_proxy.__main__:main_wrapper_dev"

[tool.ruff]
line-length = 100
exclude = ["**/versions/**"]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = ["B008"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src"]
exclude = [
  "*.pyi",
  "**/__pycache__",
  "**/node_modules",
  ".venv",
  "**/.*",
  "**/versions/**",
]

[tool.uv]
exclude-dependencies = ["nvidia-nccl-cu13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=llm_proxy --cov-report=term-missing --cov-fail-under=75"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::pytest.PytestUnhandledThreadExceptionWarning",
  "ignore:unclosed database:ResourceWarning",
]


[tool.ty.src]
include = ["src"]
exclude = [
  "*.pyi",
  "**/__pycache__",
  "**/node_modules",
  ".venv",
  "**/.*",
  "**/versions/**",
  "tests",
]
